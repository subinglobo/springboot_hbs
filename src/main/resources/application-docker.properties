# Spring Application Configuration
spring.application.name=Choosenfly-Hotel-Booking-System

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://db:5432/hotelbookingsystem
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Redis Configuration (if needed in future)
spring.redis.host=redis
spring.redis.port=6379
spring.redis.timeout=6000
spring.cache.type=redis

# RabbitMQ Configuration (if needed in future)
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


rabbitmq.queue.email=email-queue
rabbitmq.exchange=email-exchange
rabbitmq.routingkey=email-routing-key



# Comma-separated list of hotel APIs enabled (used to dynamically create queues and bindings)
rabbitmq.hotel.apis=iwtx,api2,api3,api4,api5

# Common exchange for hotel APIs
rabbitmq.hotel.exchange=hotel-exchange

# Routing keys for each hotel API (must align with your dynamic logic)
rabbitmq.hotel.routingkey.iwtx=hotel.iwtx.routingKey
rabbitmq.hotel.routingkey.api2=hotel.api2.routingKey
rabbitmq.hotel.routingkey.api3=hotel.api3.routingKey
rabbitmq.hotel.routingkey.api4=hotel.api4.routingKey
rabbitmq.hotel.routingkey.api5=hotel.api5.routingKey

